name: ${PROJECT_NAME}

services:
  budget-api-db:
    image: postgres:18.0
    container_name: budget-api-db
    environment:
      POSTGRES_DB: ${BUDGET_API_DB_DATABASE}
      POSTGRES_USER: ${BUDGET_API_DB_USER}
      POSTGRES_PASSWORD: ${BUDGET_API_DB_PASSWORD}
    ports:
      - "${BUDGET_API_DB_PORT}:5432"
    volumes:
      - budget-api_db_data:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5