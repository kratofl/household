services:
  db:
    image: mysql:latest
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  budget-api:
    build:
      context: ../budget-api
    container_name: budget-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - budget-api_data:/app
    env_file:
      - ./.env
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/api/v1/users"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # migrate:
  #   build:
  #     context: ../migrate
  #    profiles:
  #    - test

volumes:
  db_data:
  budget-api_data:

networks:
  backend: