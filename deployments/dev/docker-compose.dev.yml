services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  budget-api:
    build:
      context: ../../budget-api
      dockerfile: Dockerfile
    env_file:
      - ../.env
      - ./.env.dev
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    working_dir: /src/budget-api
    volumes:
      - ../../budget-api:/src/budget-api
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend: