name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - name: Test
        run: make backend-test

      - name: Build
        run: make backend-build

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: clients/web

      - name: Lint
        run: npm run lint
        working-directory: clients/web

      - name: Build
        run: npm run build
        working-directory: clients/web

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose files
        run: make compose-config

  docker:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    env:
      # Smoke build only verifies that images build; the per-step .dockerbuild
      # record artifacts are pure overhead and stay off the storage pool.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: release
          push: false
          load: false

      - name: Build updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile.updater
          push: false
          load: false

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: clients/web/Dockerfile
          push: false
          load: false
