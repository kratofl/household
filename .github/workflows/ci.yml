name: CI

on:
  workflow_call:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

# Release calls get their own group; only newer commits on a PR cancel old runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflows and release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"

      - name: Lint workflows and test release bundles
        run: make workflow-check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: make backend-test

      - name: Build
        run: make backend-build

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: clients/web

      - name: Lint
        run: npm run lint
        working-directory: clients/web

      - name: Build
        run: npm run build
        working-directory: clients/web

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate Compose files
        run: make compose-config

  docker:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Smoke build only verifies that images build; the per-step .dockerbuild
      # record artifacts are pure overhead and stay off the storage pool.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: release
          push: false
          load: false

      - name: Build updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile.updater
          push: false
          load: false

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: clients/web/Dockerfile
          push: false
          load: false
