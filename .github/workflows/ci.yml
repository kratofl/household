name: Monorepo CI Pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build all images with Docker Compose
        run: |
          docker compose -f ./deployments/compose.yml -f ./deployments/compose.ci.yml build

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start all containers
        run: |
          docker compose -f ./deployments/compose.yml -f ./deployments/compose.ci.yml up -d

      - name: Run Backend Tests for budget
        run: docker compose exec budget go test -v ./...

      #      - name: Run Frontend Tests
      #        run: docker-compose exec frontend npm run test -- --watch=false

      - name: Shut down containers
        run: docker compose down
