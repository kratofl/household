name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64
  CHANNEL: ${{ github.event.release.prerelease && 'unstable' || 'stable' }}

jobs:
  validate:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml

  build-images:
    name: Build and publish images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      updater_digest: ${{ steps.updater.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: release
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-api:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-api:${{ env.CHANNEL }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: clients/web/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-web:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-web:${{ env.CHANNEL }}

      - name: Build and push updater
        id: updater
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile.updater
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-updater:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-updater:${{ env.CHANNEL }}

  publish-bundle:
    name: Publish install bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-images
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.12.0"

      - name: Create release bundle
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          API_DIGEST: ${{ needs.build-images.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build-images.outputs.web_digest }}
          UPDATER_DIGEST: ${{ needs.build-images.outputs.updater_digest }}
        run: node scripts/create-release-bundle.mjs

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/household-release-bundle.tar.gz \
            dist/household-release.json \
            dist/SHA256SUMS \
            --clobber
