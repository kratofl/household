name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64
  CHANNEL: ${{ github.event.release.prerelease && 'unstable' || 'stable' }}

jobs:
  validate:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml

  # Each image is built on a runner of its own platform; emulating arm64 on an x86 runner made
  # dotnet publish and next build 10-25x slower. Builds push by digest only; merge-images tags them.
  build-images:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Keep in step with PLATFORMS above, which the release manifest reports.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          - { name: api, file: backend/Dockerfile, target: release }
          - { name: web, file: clients/web/Dockerfile, target: runner }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/household-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image.name }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/${IMAGE}"
          touch "${RUNNER_TEMP}/digests/${IMAGE}/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  # Joins the per-platform builds into one multi-arch image per service under the release tag and
  # the channel tag, and hands the resulting digests to the install bundle.
  merge-images:
    name: Publish multi-arch images
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.merge.outputs.api_digest }}
      web_digest: ${{ steps.merge.outputs.web_digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        id: merge
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected=$(tr ',' '\n' <<< "$PLATFORMS" | wc -l)
          for service in api web; do
            image="${REGISTRY}/${IMAGE_OWNER}/household-${service}"
            sources=()
            for file in "${RUNNER_TEMP}/digests/${service}"/*; do
              sources+=("${image}@sha256:$(basename "$file")")
            done
            if [ "${#sources[@]}" -ne "$expected" ]; then
              echo "::error::${service}: ${#sources[@]} platform builds, expected ${expected}"
              exit 1
            fi
            docker buildx imagetools create -t "${image}:${RELEASE_TAG}" -t "${image}:${CHANNEL}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${service}_digest=${digest}" >> "$GITHUB_OUTPUT"
          done

  publish-bundle:
    name: Publish install bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: merge-images
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - name: Create release bundle
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          API_DIGEST: ${{ needs.merge-images.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.merge-images.outputs.web_digest }}
        run: node scripts/create-release-bundle.mjs

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/household-release-bundle.tar.gz \
            dist/household-release.json \
            dist/SHA256SUMS \
            --clobber

  # Points the `stable` branch at the commit of each stable release, so deployments that track Git
  # (a Komodo stack in Git Repo mode) get the released Compose file together with the released images.
  # Nobody commits to `stable`; it only moves forward here. A release of an older commit would move
  # it backwards, so GitHub's fast-forward check fails this job instead.
  advance-stable-branch:
    name: Advance the stable branch
    needs: publish-bundle
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fast-forward stable to the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/stable" -f sha="$RELEASE_SHA" -F force=false
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/heads/stable -f sha="$RELEASE_SHA"
          fi
